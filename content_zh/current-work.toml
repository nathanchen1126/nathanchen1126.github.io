[[items]]
title = "耕作证据重绘中国农光互补的土地共享格局"
subtitle = "PV · 太阳能与土地共享"
content = "我的农光互补研究关注太阳能设施与农业耕作在何处实际形成可观测的土地共享。通过结合高分辨率影像、Sentinel-2 植被物候和机器学习分类，我识别中国光伏阵列内部可观测的耕作活动，并与项目记录及设施清单进行比较。研究进一步考察不同证据如何改变农光互补的空间格局、县域核查优先序、模型估算的发电潜力及基于植被的粮食当量代理指标。核心发现是：相近的全国总量可以掩盖显著不同的区域土地共享格局，因此，评价多功能土地时需要将证据与所关注的土地功能相匹配。"
image = "/work/agrivoltaics.webp"
