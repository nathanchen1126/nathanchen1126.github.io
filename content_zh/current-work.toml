[[items]]
title = "时间连续复合气候极端事件与作物产出"
subtitle = "TCE · 气候风险与适应"
content = "我目前的气候研究关注接连发生的高温与强降水如何影响全球作物生产风险。结合逐日气候资料、格网作物数据、作物日历和气候模式情景，我区分热后雨与雨后热两类事件序列，考察玉米、水稻、大豆和小麦的作物季暴露及区域差异，并利用空间计量与机器学习方法分析事件顺序、时间间隔与作物产出的关联。后续研究将探索符合当地条件的作物日历调整、灌溉与排水管理及作物组合，重点识别哪些应对措施可能降低产出短缺，以及哪些地区仍存在剩余风险。"
